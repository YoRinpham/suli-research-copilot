[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "research-copilot-backend"
description = "SULI (溯理): evidence-to-experiment research workspace backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.4,<1",
    "pydantic-settings>=2.5,<3",
    "alembic>=1.13,<2",
    "pymupdf>=1.24,<2",
    "python-multipart>=0.0.9,<1",
    "httpx>=0.27,<1",
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
    "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
